---
# Gemeinsame Defaults für ALLE Environments/VMs (entw, test, atu, prod).
#
# WICHTIG zur Ansible-Precedence: Diese Datei liegt neben playbook.yml/kminion.yml
# ("playbook group_vars/all") und hat DAMIT VORRANG vor
# inventory/<env>/group_vars/all.yml ("inventory group_vars/all") – bei
# gleichem Variablennamen gewinnt IMMER diese Datei, ein Eintrag in
# inventory/<env>/group_vars/all.yml wird dann stillschweigend ignoriert.
#
# Nur Werte hier eintragen, die wirklich für jede Umgebung identisch sein
# sollen. Werte, die sich pro Environment unterscheiden (oder zukünftig
# unterscheiden könnten, z. B. kminion_mirror_url), gehören weiterhin nach
# inventory/<env>/group_vars/all.yml.
kminion_version: "2.3.6"
kminion_install_dir: "/opt/local/kminion"
# Werte für kminion.yml (KMinion Prometheus-Exporter für Kafka).
# kminion_mirror_url MUSS gesetzt werden (Nexus-URL zum tar.gz).
# Broker-Liste, TLS, SASL und Exporter-Einstellungen stehen fertig gerendert
# in files/config.yaml.j2 (und die Unit in files/kminion.service).
kminion_mirror_url: "https://nexus.example.local/repository/generic-hosted/kminion/v{{ kminion_version }}/kminion_{{ kminion_version }}_linux_amd64.tar.gz"
