---
env_name: prod

# Nur diese Werte werden in der bestehenden /etc/kafka/server.properties
# auf den VMs überschrieben (Zeile für Zeile). Alles andere (Secrets, SSL, ...)
# bleibt unangetastet.
kafka_config_overrides:
  num.partitions: "12"
  default.replication.factor: "3"
  log.retention.hours: "168"

# Werte für kminion.yml (KMinion Prometheus-Exporter für Kafka).
# kminion_mirror_url MUSS gesetzt werden (Nexus-URL zum tar.gz).
# Broker-Liste, TLS, SASL und Exporter-Einstellungen stehen fertig gerendert
# in files/config.yaml.j2 (und die Unit in files/kminion.service).
kminion_version: "2.3.6"
kminion_install_dir: "/opt/local/kminion"
kminion_mirror_url: "https://nexus.example.local/repository/generic-hosted/kminion/kminion_2.3.6_linux_amd64.tar.gz"
