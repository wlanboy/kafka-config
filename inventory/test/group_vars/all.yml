---
env_name: test

# Nur diese Werte werden in der bestehenden /etc/kafka/server.properties
# auf den VMs überschrieben (Zeile für Zeile). Alles andere (Secrets, SSL, ...)
# bleibt unangetastet.
kafka_config_overrides:
  num.partitions: "6"
  default.replication.factor: "2"
  log.retention.hours: "72"
